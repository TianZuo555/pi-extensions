# Git hooks managed by lefthook (https://lefthook.dev).
# Installed automatically via the root package.json "postinstall" script.
# Skip locally with: git push --no-verify

pre-push:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    test:
      # Git exports GIT_DIR to hooks. Tests that run git in a temp repo would
      # then operate on this repository instead, so clear it first.
      run: unset GIT_DIR GIT_INDEX_FILE GIT_WORK_TREE && pnpm test
