packages:
  - "packages/*"

# Run package scripts through pnpm's bash-like shell so POSIX syntax such as
# `FOO=1 node ...` also works on Windows (CI runs the test matrix there).
shellEmulator: true

overrides:
  brace-expansion: ^5.0.12
  "@xmldom/xmldom": ^0.9.12
  "@modelcontextprotocol/sdk": ^1.31.0
  shell-quote: ^1.12.0
  sharp: ^0.35.5
  hono: ^4.13.13
  launch-editor: ^2.14.2
  "@earendil-works/pi-ai": ^1.4.0
  "@earendil-works/pi-coding-agent": ^1.4.0
  "@earendil-works/pi-tui": ^1.4.0
  "@earendil-works/pi-agent-core": ^1.4.0

# Don't install package versions published less than 2 days ago (the
# built-in default is 1 day). Applies to all deps including transitive
# ones. Keep dependabot.yml's cooldown at or above this value so version
# updates never propose a version pnpm would refuse in strict mode
# (dependabot-core#13165).
minimumReleaseAge: 2880
# Non-strict relaxes resolution only: when no aged version satisfies a
# range, pnpm falls back to a too-new one instead of failing, so a fresh
# security fix can still land. The lockfile policy check is *not* relaxed
# — every install, `--frozen-lockfile` included, re-applies
# minimumReleaseAge to lockfile entries and fails with
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION unless the entry is listed in
# minimumReleaseAgeExclude. Interactive `pnpm add`/`pnpm update` writes
# that entry for you; `pnpm update --no-save` (what Dependabot runs)
# cannot, so security-update PRs need it added by hand. See AGENTS.md.
minimumReleaseAgeStrict: false

# The pi runtime releases in lockstep and we track it closely, so exempt the
# whole family from minimumReleaseAge rather than listing each fresh pin.
# The Effect TypeScript tooling ships several times a day (tsgo plus one
# platform package per target), so the wildcard keeps a fresh pin from
# turning main red. Patterns match package names only — name@version entries
# must be exact.
minimumReleaseAgeExclude:
  - '@earendil-works/*'
  - '@effect/tsgo*'
  - '@xmorse/playwright-core@1.59.14'
  - playwriter@0.9.0

# Dependencies of the pi runtime whose install scripts npm ran automatically;
# pnpm 11 denies dependency build scripts unless explicitly allowed here.
allowBuilds:
  "@google/genai": true
  esbuild: true
  koffi: true
  lefthook: true
  msgpackr-extract: true
  protobufjs: true
