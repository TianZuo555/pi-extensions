version: 2
updates:
  # pnpm workspaces are covered by the npm ecosystem; the shared lockfile
  # lives at the repo root, so one entry covers every package.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      # Must stay >= minimumReleaseAge in pnpm-workspace.yaml (2 days),
      # otherwise pnpm refuses the versions Dependabot proposes
      # (dependabot-core#13165). Security updates bypass cooldown and
      # still open immediately.
      default-days: 3
      semver-major-days: 7
    groups:
      # The pi runtime packages release in lockstep; keep them in one PR.
      pi-runtime:
        patterns:
          - "@earendil-works/*"
          - "typebox"
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "@changesets/*"
          - "@types/*"
          - "typescript"
          - "lefthook"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
