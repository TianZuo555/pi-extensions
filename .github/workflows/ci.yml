name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      full_suite:
        description: Run the full test suite for release verification.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # `github.workflow` keeps the reusable invocation from Release in its own
  # group, so it never cancels the standalone CI run for the same commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm run typecheck

      - name: Typecheck Effect packages
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Pack dry run
        run: pnpm run pack:check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so tests can diff against the PR base branch or the
          # previous main-branch push.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pull requests and ordinary pushes run tests for changed packages
      # (dependents included). Release verification opts into the full suite.
      - name: Run tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_SUITE: ${{ inputs.full_suite }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "${FULL_SUITE}" = "true" ]; then
            echo "Full suite requested; running all tests"
            pnpm test
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            base="$(git merge-base "origin/${PR_BASE_REF}" HEAD)"
          elif [ "${EVENT_NAME}" = "push" ]; then
            base="${PUSH_BEFORE}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "Push base is unavailable; running the full suite"
              pnpm test
              exit 0
            fi
          else
            echo "Unsupported event ${EVENT_NAME}; running the full suite"
            pnpm test
            exit 0
          fi

          echo "Testing changes since ${base}"

          # Shared root configuration can affect every package. Only
          # documentation, changesets, and GitHub metadata are safe to
          # ignore when deciding whether the full suite is required.
          shared_change=false
          while IFS= read -r file; do
            case "${file}" in
              packages/*|.changeset/*|.github/*|*.md|LICENSE|LICENSE.*) ;;
              *) shared_change=true; break ;;
            esac
          done < <(git diff --name-only "${base}"...HEAD)

          if [ "${shared_change}" = "true" ]; then
            echo "Shared workspace files changed; running the full suite"
            pnpm test
          else
            # The leading ... includes dependents of changed packages; the
            # negated filter drops the root workspace project selected by
            # docs, workflow, and changeset-only changes.
            pnpm --filter "...[${base}]" --filter "!pi-extensions" test
          fi

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "job results: $RESULTS"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
