name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` keeps the reusable invocation from Release in its own
  # group, so it never cancels the standalone CI run for the same commit.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck monorepo
        run: pnpm run typecheck

      - name: Typecheck Effect packages
        run: pnpm run check

      - name: Lint
        run: pnpm run lint

      - name: Pack dry run
        run: pnpm run pack:check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so tests can diff against the PR base branch.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On PRs only run tests for packages changed since the merge base
      # (dependents included). Pushes to main and release verification
      # (workflow_call) always run the full suite.
      - name: Run tests
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)"
            echo "Testing packages changed since ${base}"
            # The leading ... includes dependents of changed packages; the
            # negated filter drops the root workspace project so root-only
            # changes (docs, CI config) don't pull in the recursive suite.
            pnpm --filter "...[${base}]" --filter "!pi-extensions" test
          else
            pnpm test
          fi

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: [checks, test]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "job results: $RESULTS"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
