name: Publish

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run in dry-run mode (no actual publish)"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck background terminals
        run: npm run check -w pi-tian-background-terminals

      - name: Typecheck commit extension
        run: npm run check -w pi-tian-commit

      - name: Typecheck goal extension
        run: npm run check -w pi-tian-goal

      - name: Typecheck image-cache extension
        run: npm run check -w pi-tian-image-cache

      - name: Typecheck repo-model extension
        run: npm run check -w pi-tian-repo-model

      - name: Typecheck repo-skills extension
        run: npm run check -w pi-tian-repo-skills

      - name: Typecheck subagents extension
        run: npm run check -w pi-tian-subagents

      - name: Typecheck todo extension
        run: npm run check -w pi-tian-todo

      - name: Typecheck token-speed extension
        run: npm run check -w pi-tian-token-speed

      - name: Typecheck usage extension
        run: npm run check -w pi-tian-usage

      - name: Typecheck vscode-bridge extension
        run: npm run check -w pi-tian-vscode-bridge

      - name: Typecheck web-search extension
        run: npm run check -w pi-tian-web-search

      - name: Test usage providers (repo-level)
        run: npm run test:usage

      - name: Test usage extension
        run: npm test -w pi-tian-usage

      - name: Test background terminals
        run: npm test -w pi-tian-background-terminals

      - name: Test ask-user extension
        run: npm test -w pi-tian-ask-user

      - name: Test commit extension
        run: npm test -w pi-tian-commit

      - name: Test edit-safe extension
        run: npm test -w pi-tian-edit-safe

      - name: Test repo-model extension
        run: npm test -w pi-tian-repo-model

      - name: Test repo-skills extension
        run: npm test -w pi-tian-repo-skills

      - name: Test subagents extension
        run: npm test -w pi-tian-subagents

      - name: Test compact-output extension
        run: npm test -w pi-tian-compact-output

      - name: Test goal extension
        run: npm test -w pi-tian-goal

      - name: Test image-cache extension
        run: npm test -w pi-tian-image-cache

      - name: Test todo extension
        run: npm test -w pi-tian-todo

      - name: Test token-speed extension
        run: npm test -w pi-tian-token-speed

      - name: Test vscode-bridge extension
        run: npm test -w pi-tian-vscode-bridge

      - name: Test web-search extension
        run: npm test -w pi-tian-web-search

      - name: Publish changed packages
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          published_any=false
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue

            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            private=$(node -p "require('./$dir/package.json').private === true")

            if [ "$private" = "true" ]; then
              echo "⏭  $name is private, skipping"
              continue
            fi

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "✔  $name@$version already published, skipping"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "🧪 [dry-run] would publish $name@$version"
              npm publish --dry-run --provenance --access public --workspace "$name"
            else
              echo "🚀 Publishing $name@$version"
              npm publish --provenance --access public --workspace "$name"
              published_any=true
            fi
          done

          if [ "$published_any" = "false" ] && [ "$DRY_RUN" != "true" ]; then
            echo "No new package versions to publish."
          fi
